name: Retire legacy web application

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  retire-site:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare empty site
        run: mkdir -p _site && printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
      - name: Upload empty site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish empty site
        uses: actions/deploy-pages@v4
