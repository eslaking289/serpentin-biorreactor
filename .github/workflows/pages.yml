name: Deploy ThermaBio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "metodologia.html"
      - "styles.css"
      - "app.js"
      - "core.js"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "robots.txt"
      - "sitemap.xml"
      - "googlebe0e85bae0c0e96a.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site files
        run: |
          mkdir _site
          cp index.html metodologia.html styles.css core.js app.js service-worker.js manifest.webmanifest robots.txt sitemap.xml googlebe0e85bae0c0e96a.html _site/
          cp -R icons _site/icons
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
