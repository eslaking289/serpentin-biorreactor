name: Build ThermaBio Android APK

on:
  push:
    branches: [main]
    tags: ['apk-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build offline native application
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Name installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ThermaBio-Android.apk

      - name: Restore archived known-good 1.6.1 APK
        if: github.ref == 'refs/tags/apk-v1.6.1'
        run: cp android/dist/ThermaBio-Android-1.6.1.apk android/app/build/outputs/apk/debug/ThermaBio-Android.apk

      - name: Save APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermaBio-Android-APK
          path: android/app/build/outputs/apk/debug/ThermaBio-Android.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish downloadable APK release
        if: startsWith(github.ref, 'refs/tags/apk-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ThermaBio Android ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/ThermaBio-Android.apk
          body: |
            APK Android nativa de ThermaBio. Funciona sin conexión y no solicita permiso de internet.

            Esta compilación está firmada con la clave de depuración automática de Android para instalación directa; no está preparada para publicarse en Google Play.
