*{box-sizing:border-box}
html{color-scheme:dark}body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

function propAgua(T) {
  const f = BD.agua.filas;
  T = Math.min(f[f.length - 1][0], Math.max(f[0][0], T)); // la tabla cubre 0–60 °C
  let i = 0;
  while (i < f.length - 2 && T > f[i + 1][0]) i++;
  const a = f[i], b = f[i + 1], t = (T - a[0]) / (b[0] - a[0]);
  const l = (j) => a[j] + (b[j] - a[j]) * t;
  const cp = l(2), k = l(3), mu = l(4);
  return { rho: l(1), cp, k, mu, Pr: (mu * cp) / k };
}

function kPared(mat, Tc, kdada) {
  if (mat === "otro") return kdada;
  const t = BD.materiales[mat].kT, T = Tc + 273.15;
  let i = 0;
  while (i < t.length - 2 && T > t[i + 1][0]) i++;
  const a = t[i], b = t[i + 1];
  return a[1] + ((b[1] - a[1]) * (T - a[0])) / (b[0] - a[0]);
}

// Balance elemental por mol de sustrato: sustrato + a·O2 + n·NH3 → y·biomasa + d·CO2 + e·H2O
function estequiometria(par) {
  const s = BD.sustratos[par.sustrato], B = BD.biomasa;
  const Ms = 12.011 * s.C + 1.008 * s.H + 15.999 * s.O;
  const y = (par.Yxs * Ms) / B.M, n = 0.2 * y, d = s.C - y;
  const e = (s.H + 3 * n - 1.8 * y) / 2, a = (0.5 * y + 2 * d + e - s.O) / 2;
  const dH = s.dHc + n * B.dHcNH3 - y * B.M * B.dHcg; // kJ/mol sustrato
  return { y, n, d, e, a, dH, kJmolO2: -dH / a, ok: d >= 0 && e >= 0 && a > 0 };
}

// L = N · √[(π·Dc)² + p²]   (Dc y p en la misma unidad que L)
function longitudHelice(N, Dc, p) {
  return N * Math.sqrt((Math.PI * Dc) ** 2 + p ** 2);
}

// Inversa: N = L / √[(π·Dc)² + p²]
function vueltasDesdeLongitud(L, Dc, p) {
  return L / Math.sqrt((Math.PI * Dc) ** 2 + p ** 2);
}

// A = π · De · L   (superficie exterior de la tubería, sin considerar extremos ni soportes)
function areaSerpentin(De, L) {
  return Math.PI * De * L;
}

// ΔTlm = (ΔT1 − ΔT2) / ln(ΔT1/ΔT2); si ΔT1 = ΔT2 el límite es ΔT1.
function dtMediaLog(dT1, dT2) {
  if (!(dT1 > 0) || !(dT2 > 0)) return NaN;
  if (Math.abs(dT1 - dT2) < 1e-9 * Math.max(dT1, dT2)) return dT1;
  return (dT1 - dT2) / Math.log(dT1 / dT2);
}

// Completa L a partir de N (o N a partir de L) según el campo editado.
function sincronizar(par, editado) {
  const q = { ...par };
  const Dc = q.Dc / 100;
  const p = q.p / 100;
  if (editado === "L") q.N = vueltasDesdeLongitud(q.L, Dc, p);
  else q.L = longitudHelice(q.N, Dc, p);
  return q;
}

const esNum = (v) => typeof v === "number" && Number.isFinite(v);

// Geometría derivada. Las proporciones del impulsor y los deflectores son ILUSTRATIVAS
// (turbina Rushton Di/3, deflectores Di/10); no son datos del usuario.
function geometria(par) {
  const Di = par.Di / 100;
  const Ht = par.Ht / 100;
  const De = par.De / 1000;
  const Dc = par.Dc / 100;
  const p = par.p / 100;
  const Vw = par.Vw / 1000;
  const Hl = (4 * Vw) / (Math.PI * Di * Di);
  const Dimp = par.Dimp / 100;
  const Wb = Di / 10;
  const Rc = Dc / 2;
  const Rr = Rc + 1.8 * De; // radio del tramo de entrada (por fuera de la hélice)
  const z0 = Math.max(0.08 * Di, De); // base de la hélice sobre el fondo
  const altura = par.N * p;
  return { Di, Ht, De, Dc, p, Vw, Hl, Dimp, Wb, Rc, Rr, z0, altura, zTop: z0 + altura, holgura: 0.01 };
}

function validar(par, sinGeom) {
  const errores = [];
  const avisos = [];
  const err = (campo, msg) => errores.push({ campo, msg });
  const avi = (campo, msg) => avisos.push({ campo, msg });

  for (const [id, c] of Object.entries(CAMPOS)) {
    const v = par[id];
    if (!esNum(v)) err(id, `${c.etiqueta}: escribe un número.`);
    else if (v < c.min || v > c.max) err(id, `${c.etiqueta}: usa un valor entre ${c.min} y ${c.max} ${c.unidad}.`);
  }
  if (errores.length) return { errores, avisos, geo: null };

  const g = geometria(par);
  const gerr = sinGeom ? () => {} : err;
  const mm = (m) => (m * 1000).toFixed(1);
  const cm = (m) => (m * 100).toFixed(1);

  if (g.Hl > g.Ht) gerr("Vw", `El volumen no cabe: llenaría ${cm(g.Hl)} cm y el tanque mide ${cm(g.Ht)} cm.`);
  else if (g.Hl / g.Ht > 0.8) avi("Vw", "El nivel supera el 80 % de la altura: queda poco espacio de cabeza.");
  if (g.Dc <= g.De) gerr("Dc", "El diámetro de la hélice debe ser mayor que el de la tubería.");
  if (g.p < g.De) gerr("p", `El paso (${cm(g.p)} cm) es menor que el diámetro exterior (${mm(g.De)} mm): las vueltas se solapan.`);
  else if (g.p < 1.5 * g.De) avi("p", "Paso menor que 1,5 veces el diámetro exterior: poco espacio de circulación entre espiras.");

  const dcMin = g.Dimp + g.De + 2 * g.holgura;
  const dcMax = 2 * (g.Di / 2 - g.Wb - g.holgura - 2.3 * g.De);
  if (g.Dc < dcMin) gerr("Dc", `La hélice toca el impulsor (diámetro = ${cm(g.Dimp)} cm). Usa un diámetro de hélice mayor que ${cm(dcMin)} cm.`);
  if (g.Dc > dcMax) gerr("Dc", `La hélice (con su tramo de entrada) choca con los deflectores. Usa un diámetro de hélice menor que ${cm(dcMax)} cm.`);
  if (g.zTop + g.De / 2 > g.Hl) gerr("N", `El serpentín mide ${cm(g.zTop + g.De / 2)} cm de alto y el nivel es ${cm(g.Hl)} cm: queda fuera del medio.`);

  if (par.Dimp > 0.7 * par.Di) err("Dimp", "El impulsor es demasiado grande: usa un diámetro menor que 0,7·Di (" + (0.7 * par.Di).toFixed(1) + " cm).");
  const bp = [par.rhob, par.cpb, par.kb, par.mub].filter((x) => x > 0).length;
  if (bp > 0 && bp < 4) err("mub", "Propiedades del caldo incompletas: escribe ρ, cp, k y μ, o deja las cuatro en 0 para usar agua de la base de datos.");
  if (par.metodo === "manual" && !(par.Qman > 0)) err("Qman", "El método manual necesita el calor metabólico en kW (mayor que 0).");
  if (par.metodo !== "manual" && !estequiometria(par).ok) err("Yxs", "El rendimiento es demasiado alto para este sustrato: el balance de carbono no cierra.");
  if (par.e * 2 >= par.De) err("e", "El espesor es demasiado grande: no queda diámetro interior.");
  if (par.Tin >= par.Tout) err("Tout", "El agua se calienta al pasar: la salida debe ser mayor que la entrada.");
  if (par.Tout >= par.Tobj) err("Tout", "La salida del agua debe ser menor que la temperatura del cultivo.");
  return { errores, avisos, geo: g };
}

// Correlaciones de tubo recto equivalente (Petukhov / Gnielinski) y diseño. No hace falta iterar: h no depende del área.
const fPet = (Re) => 1 / Math.pow(0.79 * Math.log(Re) - 1.64, 2);
function fDarcy(Re) {
  if (Re <= 2300) return 64 / Re;
  if (Re >= 4000) return fPet(Re);
  const f1 = 64 / 2300, f2 = fPet(4000);
  return f1 + ((f2 - f1) * (Re - 2300)) / 1700;
}
const nuG = (Re, Pr) => { const f = fPet(Re); return ((f / 8) * (Re - 1000) * Pr) / (1 + 12.7 * Math.sqrt(f / 8) * (Math.pow(Pr, 2 / 3) - 1)); };
function nuInterno(Re, Pr) {
  if (Re < 2300) return 3.66;
  if (Re < 3000) { const w = (Re - 2300) / 700; return (1 - w) * 3.66 + w * nuG(3000, Pr); }
  return nuG(Re, Pr);
}

function calcular(par, opt) {
  const v = validar(par, opt && opt.sinGeom);
  if (v.errores.length) return { ok: false, errores: v.errores, avisos: v.avisos };
  const g = v.geo, warn = [];
  const mol = (par.OUR * par.Vw) / 1000 / 3600; // mol O2/s
  const est = estequiometria(par);
  const Qo2 = mol * BD.fermentacion.kJporMolO2 * 1000, Qest = mol * est.kJmolO2 * 1000;
  const Qmet = par.metodo === "manual" ? par.Qman * 1000 : par.metodo === "o2" ? Qo2 : Qest;
  // Agitación
  const usaB = par.rhob > 0 && par.cpb > 0 && par.kb > 0 && par.mub > 0;
  const caldo = usaB ? { rho: par.rhob, cp: par.cpb * 1000, k: par.kb, mu: par.mub, Pr: (par.mub * par.cpb * 1000) / par.kb } : propAgua(par.Tobj), Ni = par.rpm / 60, Np = BD.impulsores[par.impulsor].Np;
  const ReA = (caldo.rho * Ni * g.Dimp ** 2) / caldo.mu;
  const P0 = Np * caldo.rho * Ni ** 3 * g.Dimp ** 5;
  const Qg = (par.aire * par.Vw) / 1000 / 60, M = BD.agitacion;
  const Pg = M.C * Math.pow((P0 * P0 * Ni * g.Dimp ** 3) / Math.pow(Qg, M.e), M.m);
  const Pagit = par.Pvol > 0 ? (par.Pvol * par.Vw) / 1000 : Pg, Qagit = par.phi * Pagit, Qotros = par.Qotros, Q = Qmet + Qagit + Qotros;
  const masa = (caldo.rho * par.Vw) / 1000, dTdt = ((Q / (masa * caldo.cp)) * 3600);
  // Agua
  const w = propAgua((par.Tin + par.Tout) / 2);
  const mdot = Q / (w.cp * (par.Tout - par.Tin));
  const caudalLmin = (mdot / w.rho) * 1000 * 60;
  const di = g.De - (2 * par.e) / 1000, Af = (Math.PI * di * di) / 4;
  const mc = mdot / par.ncir; // gasto por circuito
  const vel = mc / (w.rho * Af), Rei = (4 * mc) / (Math.PI * di * w.mu);
  const f = fDarcy(Rei);
  // Coeficientes
  const dT1 = par.Tobj - par.Tout, dT2 = par.Tobj - par.Tin, dtlm = dtMediaLog(dT1, dT2);
  const Nui = nuInterno(Rei, w.Pr), hi = (Nui * w.k) / di, Dean = Rei * Math.sqrt(di / g.Dc);
  const Rfo = par.Rfo * 1e-4, Rfi = par.Rfi * 1e-4, Nub = 0.9 * Math.pow(ReA, 0.62) * Math.pow(caldo.Pr, 0.33);
  // La temperatura de pared fija k(T) y μw; ambas dependen de U: se itera (converge en pocos pasos).
  let kp = kPared(par.material, (par.Tobj + (par.Tin + par.Tout) / 2) / 2, par.kpar), visc = 1, Twe = par.Tobj, Twi = par.Tobj, Nuo, ho, Rint, Rpar, Rext, Rtot, U;
  for (let it = 0; it < 6; it++) {
    Nuo = Nub * visc; ho = (Nuo * caldo.k) / g.Di;
    Rint = g.De / (di * hi); Rpar = (g.De * Math.log(g.De / di)) / (2 * kp); Rext = 1 / ho;
    Rtot = Rint + Rpar + Rext + Rfo + (g.De / di) * Rfi; U = 1 / Rtot;
    const flujo = U * dtlm; // W/m² sobre el área exterior
    Twe = par.Tobj - flujo * (Rext + Rfo); Twi = Twe - flujo * Rpar;
    kp = kPared(par.material, (Twe + Twi) / 2, par.kpar);
    visc = par.muwr > 0 ? Math.pow(1 / par.muwr, 0.14) : usaB ? 1 : Math.pow(caldo.mu / propAgua(Twe).mu, 0.14);
  }
  // Diseño
  const Areq = Q / (U * dtlm), Lreq = Areq / (Math.PI * g.De);
  const Lvuelta = Math.sqrt((Math.PI * g.Dc) ** 2 + g.p ** 2), Nteo = Lreq / Lvuelta, Nreal = Math.ceil(Nteo - 1e-9);
  const Linst = Nreal * Lvuelta, Ainst = Math.PI * g.De * Linst, Qcap = U * Ainst * dtlm, S = Qcap / Q;
  const dPfric = (f * (Linst / par.ncir / di) * w.rho * vel * vel) / 2;
  const qd = (w.rho * vel * vel) / 2, dPloc = par.SK * qd, dPel = w.rho * 9.80665 * par.dz, dPtot = dPfric + dPloc + dPel;
  const Pbomba = (dPtot * (mdot / w.rho)) / par.eta; // W
  const verif = [];
  const mCont = w.rho * vel * Af * par.ncir, Qagua = mdot * w.cp * (par.Tout - par.Tin);
  const dOpt = Math.sqrt((4 * mc) / (w.rho * Math.PI * 1.5));
  verif.push({ ok: Math.abs(mCont - mdot) / mdot < 1e-6, t: "Continuidad: ρ·v·A reproduce el gasto másico", v: `${(mCont * 1000).toPrecision(4)} g/s vs ${(mdot * 1000).toPrecision(4)} g/s`, msg: "El caudal no es congruente con la velocidad (continuidad)." });
  verif.push({ ok: Math.abs(Qagua - Q) / Q < 1e-6, t: "Balance de energía del agua: ṁ·cp·ΔT = Q", v: `${Qagua.toPrecision(5)} W vs ${Q.toPrecision(5)} W`, msg: "El agua no retira la carga de calor calculada." });
  verif.push({ ok: vel >= 0.5 && vel <= 2.5, t: "Velocidad del agua entre 0,5 y 2,5 m/s", v: `${vel.toFixed(2)} m/s`, msg: `Velocidad del agua incongruente con el caudal: ${vel.toFixed(2)} m/s (rango 0,5–2,5). Para ≈1,5 m/s el diámetro interior sería ≈ ${(dOpt * 1000).toFixed(1)} mm, o aumenta los circuitos en paralelo (hoy ${par.ncir}).` });
  if (par.Qdisp > 0) {
    const md = (par.Qdisp / 3600) * w.rho, Rfl = md / mdot, Tsd = par.Tin + Q / (md * w.cp);
    verif.push({ ok: Rfl >= 1, t: "Caudal disponible ≥ requerido (R = ṁdisp/ṁreq)", v: `R = ${Rfl.toFixed(2)} · Tsal,disp = ${Tsd.toFixed(1)} °C`, msg: `El caudal disponible (${par.Qdisp} m³/h) es menor que el requerido (${(mdot / w.rho * 3600).toFixed(1)} m³/h): el agua saldría a ${Tsd.toFixed(1)} °C.` });
  }
  verif.push({ ok: dPtot > 0, t: "ΔP total positivo (el circuito requiere bomba)", v: `${(dPtot / 1000).toFixed(2)} kPa`, msg: "ΔP total ≤ 0: la elevación Δz compensa las pérdidas; revisa Δz y ΣK." });
  verif.push({ ok: Qcap >= Q * (1 - 1e-9), t: "Capacidad instalada ≥ carga (S ≥ 1)", v: `S = ${S.toFixed(3)}`, msg: "El serpentín instalado no cubre la carga." });
  verif.push({ ok: Twe > par.Tin && Twe < par.Tobj, t: "Temperatura de pared entre el agua y el caldo", v: `${Twe.toFixed(1)} °C`, msg: "Temperatura de pared fuera del intervalo físico: revisa las temperaturas." });
  const Hserp = (Nreal - 1) * g.p + g.De;
  const L = longitudHelice(par.N, g.Dc, g.p), A = areaSerpentin(g.De, L);
  if (vel < 0.5 || vel > 2.5) warn.push(`La velocidad del agua (${vel.toFixed(2)} m/s) está fuera de 0,5–2,5 m/s: cambia el diámetro interior o reparte el caudal en circuitos en paralelo.`);
  if (Rei < 3000 || w.Pr < 0.5 || w.Pr > 2000) warn.push(`Re del agua = ${Math.round(Rei)}: Gnielinski se usa fuera de su rango (Re 3000–5×10⁶); el resultado es orientativo.`);
  if (ReA < 1e4) warn.push(`Re de agitación = ${Math.round(ReA)}: menor que 10 000, el régimen no es turbulento y Np y la correlación de h exterior pueden no aplicar.`);
  if (Hserp + 2 * g.De > g.Hl) warn.push(`El serpentín necesario (${(Hserp * 100).toFixed(1)} cm de alto más holguras) no cabe en el nivel de líquido (${(g.Hl * 100).toFixed(1)} cm): aumenta Dc, el paso o usa tubería más gruesa.`);
  return { ok: true, avisos: v.avisos, warn, geo: g, est, mol, Qo2, Qest, Qmet, ReA, P0, Pg, Qg, Qagit, Qotros, Q, masa, dTdt, mdot, caudalLmin, di, Af, vel, Rei, f, dPfric, Nui, hi, Dean, Nuo, ho, kp, Rfo, Rfi, Rext, Rpar, Rint, Rtot, U, dT1, dT2, dtlm, Areq, Lreq, Lvuelta, Nteo, Nreal, Nreq: Nreal, Linst, Ainst, Qcap, S, Hserp, L, A, suficiente: A >= Areq, w, caldo, mc, usaB, Pagit, qd, dPloc, dPel, dPtot, Pbomba, verif, Twe, Twi, visc, mCont, Qagua };
}

const NO_DESPEJABLES = ["L", "N"]; // L y N no afectan a las metas; usa "Usar las vueltas calculadas"

function resolverDespeje(par, k, metaId, target, lo, hi) {
  const m = METAS.find((x) => x.id === metaId), C = CAMPOS[k];
  if (!m || !C) return { ok: false, msg: "Elige una variable y una meta." };
  if (!Number.isFinite(target)) return { ok: false, msg: "Escribe el valor de la meta como número." };
  lo = Number.isFinite(lo) ? lo : C.min; hi = Number.isFinite(hi) ? hi : C.max;
  if (!(lo < hi)) return { ok: false, msg: "El límite inferior debe ser menor que el superior." };
  const ev = (x) => { const r = calcular({ ...par, [k]: x }, { sinGeom: true }); return r.ok ? m.f(r) : NaN; };
  const lo2 = lo <= 0 ? Math.max(hi * 1e-6, (C.paso || 1e-3) / 10) : lo;
  const geo = lo2 > 0 && hi / lo2 > 20, n = 160, pts = [];
  for (let i = 0; i <= n; i++) pts.push(geo ? lo2 * Math.pow(hi / lo2, i / n) : lo2 + ((hi - lo2) * i) / n);
  const val = pts.map(ev);
  const fin = val.filter(Number.isFinite);
  if (!fin.length) {
    const r = calcular({ ...par, [k]: Math.min(hi, Math.max(lo2, par[k])) }, { sinGeom: true });
    return { ok: false, msg: "Con estos datos el cálculo no es válido en todo el intervalo." + (r.errores && r.errores.length ? " " + r.errores[0].msg : "") };
  }
  if (Math.max(...fin) - Math.min(...fin) < 1e-12 * Math.max(1, Math.abs(fin[0]))) return { ok: false, msg: `${C.etiqueta} no afecta a "${m.et}" con la configuración actual (por ejemplo, un dato opcional desactivado).` };
  const raices = []; let prev = -1;
  for (let i = 0; i <= n; i++) {
    if (!Number.isFinite(val[i])) continue;
    const d = val[i] - target;
    if (d === 0) raices.push([pts[i], pts[i]]);
    else if (prev >= 0 && (val[prev] - target) * d < 0) raices.push([pts[prev], pts[i]]);
    prev = i;
  }
  if (!raices.length) return { ok: false, msg: `Ninguna ${C.etiqueta.toLowerCase()} entre ${lo2.toPrecision(4)} y ${hi} ${C.unidad} da ${target} ${m.u}. Con ese intervalo, "${m.et}" va de ${Math.min(...fin).toPrecision(4)} a ${Math.max(...fin).toPrecision(4)} ${m.u}.` };
  let [a, b] = raices[0];
  if (a !== b) for (let i = 0; i < 100; i++) {
    const mid = (a + b) / 2, fm = ev(mid) - target, fa = ev(a) - target;
    if (!Number.isFinite(fm)) { b = mid; continue; }
    if (fa * fm <= 0) b = mid; else a = mid;
  }
  let x = (a + b) / 2, redondeo = false;
  if (k === "ncir") { x = Math.ceil(x - 1e-9); redondeo = true; } // circuitos: número entero, hacia arriba
  const comprobado = ev(x);
  return { ok: true, x, comprobado, redondeo, meta: m, campo: C, soluciones: raices.length, otras: raices.slice(1).map((r) => (r[0] + r[1]) / 2) };
}

// ===== Escena isométrica del biorreactor =====
const SCENE = (() => {
  const W = 620; let H = 470; const AZ = 42, EL = 28;
  const D2R = Math.PI / 180;
  let P = null;
  let KS = 1;

  const pt = (x, y, z) => iso([x, y, z], P);
  const pol = (r, deg, z) => [r * Math.cos(deg * D2R), r * Math.sin(deg * D2R), z];
  const pp = (r, deg, z) => pt(...pol(r, deg, z));
  const cosA = (deg) => Math.cos((deg - AZ) * D2R);
  const sinA = (deg) => Math.sin((deg - AZ) * D2R);
  const wrap = (deg) => ((deg % 360) + 360) % 360;
  const S = (paths, style) => solidSvg(paths, style);
  const L = (d, style) => lineSvg(d, style);
  const part = (id, inner, extra = "") => `<g data-part="${id}"${extra}>${inner}</g>`;
  const hit = (d, w) => (d ? `<path class="bx-hit" d="${d}" style="stroke-width:${w.toFixed(1)}"/>` : "");

  function hull(points) {
    const pts = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (pts.length < 3) return pts;
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [];
    for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    const up = [];
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    return [...lo.slice(0, -1), ...up.slice(0, -1)];
  }

  // Superficie lateral de un cilindro vertical por tiras, con cuatro tonos y un brillo de acero.
  function wall(r, z0, z1, a0, a1, { inside = false, step = 4, spec = true, cx = 0, cy = 0 } = {}) {
    const n = Math.max(1, Math.ceil(Math.abs(a1 - a0) / step));
    const fill = [], tones = [[], [], [], []], glint = [];
    const sign = inside ? -1 : 1;
    for (let i = 0; i < n; i++) {
      const p = a0 + ((a1 - a0) * i) / n, q = a0 + ((a1 - a0) * (i + 1)) / n, m = (p + q) / 2;
      if (cosA(m) * sign <= 0.0001) continue;
      const s = sinA(m) * sign;
      const d = pathOf([pt(cx + r * Math.cos(p * D2R), cy + r * Math.sin(p * D2R), z1), pt(cx + r * Math.cos(q * D2R), cy + r * Math.sin(q * D2R), z1), pt(cx + r * Math.cos(q * D2R), cy + r * Math.sin(q * D2R), z0), pt(cx + r * Math.cos(p * D2R), cy + r * Math.sin(p * D2R), z0)], true);
      fill.push(d);
      const shade = Math.min(3, Math.max(0, Math.floor(((s + 1) / 2) * 4)));
      if (spec && Math.abs(s - 0.5) < 0.075) glint.push(d); else tones[shade].push(d);
    }
    if (!fill.length) return "";
    return `<g class="iso-solid" data-seamless><path class="iso-fill" d="${fill.join("")}"/>${tones.map((t, i) => (t.length ? `<path class="iso-shade" data-shade="${i}" d="${t.join("")}"/>` : "")).join("")}${glint.length ? `<path class="iso-top" d="${glint.join("")}"/>` : ""}</g>`;
  }

  function arcPath(r, z, a0, a1, want = 1, step = 3) {
    const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / step));
    let d = "", run = [];
    for (let i = 0; i <= n; i++) {
      const a = a0 + ((a1 - a0) * i) / n;
      if (cosA(a) * want > 0.0001) run.push(pp(r, a, z));
      else { if (run.length > 1) d += pathOf(run); run = []; }
    }
    if (run.length > 1) d += pathOf(run);
    return d;
  }

  function basis(axis) {
    const a = unitv(axis);
    const t = Math.abs(a[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
    let u = crossv(a, t);
    u = unitv(u);
    const v = crossv(a, u);
    return { a, u, v };
  }
  const unitv = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  const crossv = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const addv = (a, b, s = 1) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
  const dotv = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const viewV = () => { const c = cameraOf(P); return [c.cosA * c.cosE, c.sinA * c.cosE, c.sinE]; };

  // Disco o brida con eje cualquiera: casco de dos anillos, con la tapa visible más clara.
  function disc3(c, axis, r, thick, { tone = "mid", n = 28, shade } = {}) {
    const { a, u, v } = basis(axis);
    const ring3 = (center) => Array.from({ length: n }, (_, i) => { const t = (i / n) * Math.PI * 2; return pt(...addv(addv(center, u, r * Math.cos(t)), v, r * Math.sin(t))); });
    const c0 = addv(c, a, -thick / 2), c1 = addv(c, a, thick / 2);
    const r0 = ring3(c0), r1 = ring3(c1);
    const h = hull([...r0, ...r1]);
    const faceUp = dotv(a, viewV()) > 0;
    const top = faceUp ? r1 : r0;
    const lit = Math.min(3, Math.max(0, shade ?? 2));
    return `<g class="iso-solid"><path class="iso-fill" d="${pathOf(h, true)}"/><path class="iso-shade" data-shade="${lit}" d="${pathOf(h, true)}"/><path class="iso-top" d="${pathOf(top, true)}"/><path class="iso-line iso-edge" data-tone="${tone}" d="${pathOf(h, true)}"/><path class="iso-line" data-tone="faint" d="${pathOf(top, true)}"/></g>`;
  }

  // Tubo por trazos: borde, cuerpo, brillo y, si se pide, núcleo con fluido.
  function tube(points3, r, { core, flow, cls = "", glow = 0 } = {}) {
    const pts = points3.map((p) => pt(...p));
    const d = pathOf(pts);
    const w = Math.max(1.6, 2 * r * KS);
    let out = `<g class="bx-pipe ${cls}">`;
    if (glow) out += `<path class="bx-glow" d="${d}" style="stroke:${glow.color};stroke-width:${(w * 5.2).toFixed(1)};opacity:${glow.a1}"/><path class="bx-glow" d="${d}" style="stroke:${glow.color};stroke-width:${(w * 2.8).toFixed(1)};opacity:${glow.a2}"/>`;
    out += `<path class="bx-edge" d="${d}" style="stroke-width:${(w + 1.5).toFixed(1)}"/><path class="bx-body" d="${d}" style="stroke-width:${w.toFixed(1)}"/>`;
    out += `<path class="bx-shine" d="${d}" style="stroke-width:${(w * 0.24).toFixed(1)}" transform="translate(${(-w * 0.2).toFixed(1)} ${(-w * 0.2).toFixed(1)})"/>`;
    if (core) out += `<path class="bx-core" d="${d}" style="stroke:${core};stroke-width:${(w * 0.42).toFixed(1)}"/>`;
    if (flow) out += `<path class="bx-flowline" data-flow d="${d}" style="stroke-width:${(w * 0.2).toFixed(1)}"/>`;
    return out + "</g>";
  }

  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const STOPS = [[0, [37, 99, 235]], [0.3, [56, 189, 248]], [0.55, [253, 230, 138]], [0.8, [251, 146, 60]], [1, [239, 68, 68]]];
  function tempColor(u) {
    const x = Math.min(1, Math.max(0, u));
    for (let i = 1; i < STOPS.length; i++) {
      if (x <= STOPS[i][0]) { const [x0, c0] = STOPS[i - 1], [x1, c1] = STOPS[i]; const c = mix(c0, c1, (x - x0) / (x1 - x0)); return `rgb(${c[0]},${c[1]},${c[2]})`; }
    }
    return "rgb(239,68,68)";
  }

  // ---------- Geometría del modelo (unidades de mundo ≈ cm × f) ----------
  function model(par) {
    const f = 150 / par.Ht;
    const u = (cm) => cm * f;
    const Di = u(par.Di), Ri = Di / 2;
    const t = Math.max(1.6, 0.022 * Di), Ro = Ri + t;
    const Hh = 150;
    const Hl = Math.min(Hh * 0.97, u((4000 * par.Vw) / (Math.PI * par.Di * par.Di)));
    const tb = Math.max(2.2, 0.035 * Di);
    const lidT = Math.max(2.4, 0.03 * Di);
    const Rl = Ro + 0.035 * Di;
    const Wb = Di / 10, Dimp = u(par.Dimp), Rimp = Dimp / 2;
    const de = Math.max(2.6, u(par.De / 10));
    const Rc = u(par.Dc) / 2;
    const pv = Math.max(de * 1.05, u(par.p));
    const z0 = Math.max(0.08 * Di, de);
    const Rr = Rc + 1.8 * de;
    const N = par.N;
    const zTop = z0 + N * pv;
    const legH = 0.32 * Di;
    const zLid = Hh + lidT;
    const Rin = Rc - de / 2;
    return { f, Di, Ri, Ro, t, Hh, Hl, tb, lidT, Rl, Wb, Dimp, Rimp, de, Rc, pv, z0, Rr, N, zTop, legH, zLid, Rin };
  }

  // Camino del refrigerante: entrada, arco bajo la hélice, tramo radial, hélice y salida.
  function flowPath(g) {
    const thIn = AZ - 75, thOut = AZ + 75;
    const th0 = thOut - 360 * g.N;
    const zS = g.Hh + g.lidT * 0.5;
    const pts = [];
    const add = (p, kind) => pts.push({ p, kind });
    add([...pol(g.Rr, thIn, zS)], "rin");
    add([...pol(g.Rr, thIn, g.z0)], "rin");
    let d = wrap(th0) - wrap(thIn);
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    const na = Math.max(2, Math.ceil(Math.abs(d) / 3));
    for (let i = 1; i <= na; i++) add(pol(g.Rr, thIn + (d * i) / na, g.z0), "arc");
    const thS = thIn + d;
    const nr = 6;
    for (let i = 1; i <= nr; i++) add(pol(g.Rr + (g.Rc - g.Rr) * (i / nr), thS, g.z0), "stub");
    const nh = Math.max(4, Math.ceil(g.N * 360 / 4));
    for (let i = 1; i <= nh; i++) { const s = (g.N * i) / nh; add(pol(g.Rc, thS + 360 * s, g.z0 + g.pv * s), "helix"); }
    const thE = thS + 360 * g.N;
    add(pol(g.Rc, thE, zS), "rout");
    let ell = 0, h0 = null, h1 = null;
    pts.forEach((q, i) => {
      if (i) ell += Math.hypot(q.p[0] - pts[i - 1].p[0], q.p[1] - pts[i - 1].p[1], q.p[2] - pts[i - 1].p[2]);
      q.ell = ell;
      if (q.kind === "helix") { if (h0 === null) h0 = pts[i - 1].ell; h1 = ell; }
    });
    return { pts, th0: thS, thE, thIn, thOut, ell, h0, h1, zS };
  }
  const sideOf = (p) => (Math.cos((Math.atan2(p[1], p[0]) / D2R - AZ) * D2R) >= 0 ? 1 : 0);

  // ---------- Construcción estática ----------
  function build(par, opt) {
    const g = model(par);
    H = opt.compact ? 610 : 470;
    const mode = opt.view; // cut | glass | closed
    const margin = 0.2 * g.Di;
    const ext = Math.max(g.Rl, g.Ro + 0.19 * g.Di);
    const zMin = -g.tb - g.legH - 2;
    const zMax = g.zLid + 0.5 * g.Di;
    const corners = [];
    for (const x of [-ext, ext]) for (const y of [-ext, ext]) for (const z of [zMin, zMax]) corners.push([x, y, z]);
    const padX = opt.compact ? 26 : 112;
    const fit = fitProjection(corners, W - padX * 2, H, { pad: 18, azimuth: AZ, elevation: EL });
    P = { ...fit, origin: [fit.origin[0] + padX, fit.origin[1]] };
    KS = cameraOf(P).k;

    const path = flowPath(g);
    const Tin = par.Tin, Tout = par.Tout, T0 = par.T0;
    const cScale = (T) => tempColor((T - Tin) / Math.max(1, T0 - Tin));
    const A = { cut: 62 };
    const cutHalf = mode === "cut" ? A.cut : 0;
    const out = {};
    const anchors = {};

    // --- Base: patas, drenaje, placa del fondo
    const legAngles = [AZ + 45, AZ - 45, AZ + 135, AZ - 135];
    const legs = legAngles.map((a) => ({ a, d: cosA(a) })).sort((x, y) => x.d - y.d);
    const legSvg = (l, front) => {
      const [x, y] = pol(g.Ro * 0.8, l.a, 0);
      const lh = g.legH;
      return S(cylinder(x, y, 0.065 * g.Di, -g.tb - lh, 1.8, P, 22), { tone: "lo" }) + S(cylinder(x, y, 0.045 * g.Di, -g.tb - lh + 1.8, lh - 1.8, P, 22), { tone: "mid", crease: "none" }) + S(cylinder(x, y, 0.058 * g.Di, -g.tb - 4, 4, P, 22), { tone: "mid" });
    };
    const D = 0.026 * g.Di;
    const vz = -g.tb - g.legH * 0.52;
    const drain = (() => {
      let s = S(cylinder(0, 0, D, -g.tb - g.legH * 0.96, g.legH * 0.96, P, 18), { tone: "mid", crease: "none" });
      s += S(cylinder(0, 0, D * 1.9, vz, 0.06 * g.Di, P, 22, 0.4), { tone: "hi" });
      s += S(cylinder(0, 0, D * 1.25, vz + 0.06 * g.Di, 0.025 * g.Di, P, 18), { tone: "mid" });
      const lever = slabOf({ x: -D * 0.5, y: -D * 0.4, w: D * 5, d: D * 0.8, r: 0.3 }, vz + 0.085 * g.Di, D * 0.7, P, 2, 0.2);
      s += S(lever, { tone: "lit", lit: true });
      s += S(cylinder(0, 0, D * 1.7, -g.tb - g.legH * 0.96, 2.4, P, 20), { tone: "hi" });
      return s;
    })();
    const plate = S(cylinder(0, 0, g.Ro + 0.012 * g.Di, -g.tb, g.tb, P, 56, 0.8), { tone: "mid" }) + L(ring(0, 0, g.Ro + 0.012 * g.Di - 1.6, 0, P, 56), { tone: "faint" }) + L(ring(0, 0, g.Ri, 0, P, 56), { tone: "lo" });
    const halo = `<path class="iso-halo" d="${haloOf({ x: -g.Ro, y: -g.Ro, w: 2 * g.Ro, d: 2 * g.Ro, r: g.Ro }, -g.tb - g.legH, 3, P)}"/>`;
    out.base = halo + legs.filter((l) => l.d < 0).map((l) => legSvg(l)).join("") + part("drain", drain + hit(pathOf([pt(0, 0, -g.tb), pt(0, 0, -g.tb - g.legH * 0.95)]), 12)) + legs.filter((l) => l.d >= 0).map((l) => legSvg(l)).join("") + plate;
    anchors.drain = { p: [0, 0, vz + 0.03 * g.Di], side: "R", text: "Drenaje" };

    // --- Interior trasero: pared interna, líquido, deflectores y soportes de atrás
    const liqHull = hull([...Array.from({ length: 48 }, (_, i) => pp(g.Ri - 0.4, (i / 48) * 360, 0)), ...Array.from({ length: 48 }, (_, i) => pp(g.Ri - 0.4, (i / 48) * 360, g.Hl))]);
    const innerBack = wall(g.Ri, 0, g.Hh, AZ + 90, AZ + 270, { inside: true, spec: false });
    const liqBack = part("medium", `<path class="bx-liq" d="${pathOf(liqHull, true)}"/>`);
    let back = (mode === "closed" ? "" : innerBack) + L(arcPath(g.Ri, g.Hh, AZ + 90, AZ + 270, -1), { tone: "lo" }) + L(arcPath(g.Ri, 0, AZ + 90, AZ + 270, -1), { tone: "lo" });
    if (mode !== "closed") back += liqBack;

    const baffleAngles = [45, 135, 225, 315].map((d) => AZ + d);
    const baffleTop = Math.min(g.Hh - 8, g.Hl + 0.04 * g.Di);
    const baffleSvg = (a) => {
      const bt = Math.max(1.1, 0.012 * g.Di);
      const er = [Math.cos(a * D2R), Math.sin(a * D2R)], et = [-er[1], er[0]];
      const r0 = g.Ri - g.Wb, r1 = g.Ri - 0.25;
      const ring3 = [[r0, -bt / 2], [r1, -bt / 2], [r1, bt / 2], [r0, bt / 2]].map(([r, tt]) => [r * er[0] + tt * et[0], r * er[1] + tt * et[1]]);
      const z0b = 0.025 * g.Di, hb = baffleTop - z0b;
      const sl = S(extrude(ring3, z0b, hb, P), { tone: "mid" });
      const [bx, by] = [(r0 + r1) / 2 * er[0], (r0 + r1) / 2 * er[1]];
      const dots = [0.18, 0.5, 0.82].map((q) => pt(r1 * er[0] - er[0] * 2, r1 * er[1] - er[1] * 2, z0b + hb * q));
      return part("baffle", sl + hit(pathOf([pp(g.Ri - g.Wb / 2, a, z0b + 4), pp(g.Ri - g.Wb / 2, a, baffleTop - 4)]), 14));
    };
    const backBaffles = baffleAngles.filter((a) => cosA(a) < 0).sort((x, y) => cosA(x) - cosA(y)).map(baffleSvg).join("");
    const frontBaffles = baffleAngles.filter((a) => cosA(a) >= 0).map(baffleSvg).join("");
    back += backBaffles;

    // Sondas y varillas
    const rP = (g.Ri - g.Wb + (g.Rr + g.de / 2)) / 2;
    const probes = [
      { id: "tprobe", a: AZ + 160, r: Math.max(0.9, 0.009 * g.Di), zEnd: g.Hl * 0.42 },
      { id: "phprobe", a: AZ + 190, r: Math.max(1.5, 0.015 * g.Di), zEnd: g.Hl * 0.5 },
    ];
    const probeSvg = (q) => {
      const [x, y] = pol(rP, q.a, 0);
      const body = S(cylinder(x, y, q.r, q.zEnd, g.Hh - q.zEnd, P, 14), { tone: q.id === "tprobe" ? "mid" : "hi", crease: "none" }) + S(cylinder(x, y, q.r * 0.7, q.zEnd - 4, 4, P, 12), { tone: "lo" });
      return part(q.id, body + hit(pathOf([pt(x, y, q.zEnd), pt(x, y, g.Hh)]), 12));
    };
    const rodAngles = [AZ + 25, AZ + 125];
    const rodTop = g.Hh, rodBot = g.z0 + g.de * 1.1;
    const rodR = Math.max(0.7, 0.2 * g.de);
    const rodSvg = (a) => {
      const [x, y] = pol(g.Rr, a, 0);
      return part("support", S(cylinder(x, y, rodR, rodBot, rodTop - rodBot, P, 12), { tone: "mid", crease: "none" }) + S(cylinder(x, y, rodR * 1.9, rodBot - 1.4, 1.4, P, 14), { tone: "lo" }) + hit(pathOf([pt(x, y, rodBot), pt(x, y, rodTop)]), 12));
    };
    for (const q of probes.filter((q) => cosA(q.a) < 0)) back += probeSvg(q);
    for (const a of rodAngles.filter((a) => cosA(a) < 0)) back += rodSvg(a);
    out.back = back;

    // --- Serpentín por tramos
    const helixLen = path.h1 - path.h0;
    const Tat = (ell) => Tin + (Tout - Tin) * Math.min(1, Math.max(0, (ell - path.h0) / helixLen));
    const maxRun = Math.max(25, g.Rc * 1.2);
    const runs = [];
    const grp = (k) => (k === "rin" || k === "arc" || k === "stub" ? "in" : k);
    let cur = null;
    path.pts.forEach((q, i) => {
      const sd = sideOf(q.p), gr = grp(q.kind);
      if (!cur) { cur = { side: sd, group: gr, pts: [q], from: q.ell }; return; }
      if (sd !== cur.side || gr !== cur.group || q.ell - cur.from > maxRun) {
        cur.pts.push(q);
        runs.push(cur);
        cur = { side: sd, group: gr, pts: [path.pts[i - 1], q], from: q.ell };
      } else cur.pts.push(q);
    });
    if (cur) runs.push(cur);
    const coilBack = [], coilFront = [];
    const coilTube = (run) => {
      const mid = run.pts[Math.floor(run.pts.length / 2)].ell;
      const col = cScale(Tat(mid));
      const pts3 = run.pts.map((q) => q.p);
      const d = pathOf(pts3.map((p) => pt(...p)));
      return part("coil", tube(pts3, g.de / 2, { cls: "mat-" + par.material, core: col, flow: true, glow: { color: col, a1: 0.07, a2: 0.1 } }) + hit(d, 14));
    };
    for (const run of runs) {
      const kind = run.group;
      const svg = kind === "in" ? part("cin", tube(run.pts.map((q) => q.p), g.de / 2, { core: cScale(Tin), flow: true }) + hit(pathOf(run.pts.map((q) => pt(...q.p))), 14)) : kind === "rout" ? part("cout", tube(run.pts.map((q) => q.p), g.de / 2, { core: cScale(Tout), flow: true }) + hit(pathOf(run.pts.map((q) => pt(...q.p))), 14)) : coilTube(run);
      (run.side ? coilFront : coilBack).push(svg);
    }

    // Tabs y abrazaderas de los soportes
    const tabs = { back: "", front: "" };
    for (const a of rodAngles) {
      const s0 = wrap(a - path.th0) / 360;
      const tabsSvg = [];
      for (let k = 0; ; k++) {
        const s = s0 + k;
        if (s > g.N - 0.02) break;
        const z = g.z0 + g.pv * s;
        if (z < rodBot + g.de * 0.4 || k % 2 === 1) continue;
        const rodPt = pol(g.Rr - rodR * 0.4, a, z), coilPt = pol(g.Rc + g.de * 0.42, a, z);
        const tang = unitv([-Math.sin(a * D2R) * g.Rc, Math.cos(a * D2R) * g.Rc, g.pv / (2 * Math.PI)]);
        const c0 = pol(g.Rc, a, z);
        const cl0 = addv(c0, tang, -g.de * 0.5), cl1 = addv(c0, tang, g.de * 0.5);
        tabsSvg.push(tube([rodPt, coilPt], g.de * 0.2, { cls: "bx-tab" }) + `<g class="bx-pipe bx-clamp"><path class="bx-edge" d="${pathOf([pt(...cl0), pt(...cl1)])}" style="stroke-width:${(g.de * KS * 1.45 + 1.3).toFixed(1)};stroke-linecap:butt"/><path class="bx-body" d="${pathOf([pt(...cl0), pt(...cl1)])}" style="stroke-width:${(g.de * KS * 1.45).toFixed(1)};stroke-linecap:butt"/></g>`);
      }
      tabs[cosA(a) < 0 ? "back" : "front"] += part("support", tabsSvg.join(""));
    }
    out.coilBack = coilBack.join("") + tabs.back;

    // --- Flujo interno: lazos de recirculación y anillos en la superficie
    const lazo = (zc, up) => {
      const rl = g.Ri - g.Wb * 1.15, rc = (g.Rimp * 1.06 + rl) / 2, rx = (rl - g.Rimp * 1.06) / 2, rz = Math.min(g.Dimp * 0.42, 0.5 * (up ? g.Hl - zc - 3 : zc - 6));
      if (rz < 5) return "";
      const zcx = zc + (up ? rz : -rz);
      const pts = [];
      for (let i = 0; i <= 40; i++) {
        const tt = up ? -90 + (360 * i) / 40 : 90 - (360 * i) / 40;
        const rr = rc + rx * Math.cos(tt * D2R), zz = zcx + rz * Math.sin(tt * D2R);
        pts.push(pp(rr, AZ + 90, zz));
      }
      return L(pathOf(pts), { tone: "lo", flow: true, className: "bx-loop" });
    };
    const z1 = Math.min(g.Dimp, g.Hl * 0.34), z2 = z1 + 1.5 * g.Dimp;
    const show2 = z2 + g.Dimp * 0.24 + 4 < g.Hl;
    let flowSvg = lazo(z1, true) + lazo(z1, false) + (show2 ? lazo(z2, true) + lazo(z2, false) : "");
    out.flow = flowSvg;
    out.imp = { z1, z2, show2, Rimp: g.Rimp, Rin: g.Rin };

    // Eje
    const rs = Math.max(1.1, 0.013 * g.Di);
    const shaftBot = 0.012 * g.Di + 1;
    const shaft = S(cylinder(0, 0, rs * 1.9, 0, 3, P, 18), { tone: "lo" }) + S(cylinder(0, 0, rs, 3, g.zLid + 0.1 * g.Di - 3, P, 18), { tone: "mid", crease: "none" });
    out.shaft = part("shaft", shaft + hit(pathOf([pt(0, 0, 4), pt(0, 0, g.Hh)]), 12));

    // --- Frente interior
    out.front = frontBaffles + probes.filter((q) => cosA(q.a) >= 0).map(probeSvg).join("") + rodAngles.filter((a) => cosA(a) >= 0).map(rodSvg).join("") + coilFront.join("") + tabs.front;

    // Velo de líquido, superficie y anillos
    const surf = Array.from({ length: 56 }, (_, i) => pp(g.Ri - 0.4, (i / 56) * 360, g.Hl));
    let veil = `<g class="bx-veil">`;
    veil += `<path class="bx-liq bx-liq-front" d="${pathOf(liqHull, true)}"/>`;
    veil += `<path class="bx-liq bx-liq-surf" d="${pathOf(surf, true)}"/>`;
    veil += L(pathOf(surf, true), { tone: "mid" });
    for (const [q, dash, dur] of [[0.82, "6 10", 5.5], [0.6, "4 9", 4.2], [0.38, "3 8", 3.1]]) {
      const ringPts = Array.from({ length: 48 }, (_, i) => pp(g.Ri * q, (i / 48) * 360, g.Hl));
      veil += `<path class="bx-swirl" d="${pathOf(ringPts, true)}" style="stroke-dasharray:${dash};animation-duration:${dur}s"/>`;
    }
    veil += `</g>`;
    out.veil = mode === "closed" ? "" : veil;

    // Flechas de calor: del medio hacia la tubería
    const hasHeat = [];
    const sPick = (a, frac) => { const s0 = wrap(a - path.th0) / 360; const k = Math.floor(g.N * frac - s0); return Math.max(0, Math.min(g.N, s0 + Math.max(0, k))); };
    const arrow = (pa, pb) => {
      const a = pt(...pa), b = pt(...pb);
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
      const h = 5;
      const tip = [b[0], b[1]], l1 = [b[0] - ux * h - uy * h * 0.6, b[1] - uy * h + ux * h * 0.6], l2 = [b[0] - ux * h + uy * h * 0.6, b[1] - uy * h - ux * h * 0.6];
      return `<path class="bx-heat-line" data-flow d="${pathOf([a, b])}"/><path class="bx-heat-head" d="${pathOf([l1, tip, l2], false)}"/>`;
    };
    let heat = "";
    for (const [da, frac] of [[-26, 0.28], [4, 0.5], [30, 0.72], [-6, 0.86]]) {
      const a = AZ + da;
      const s = sPick(a, frac);
      if (s < 0.4 || s > g.N - 0.3) continue;
      const z = g.z0 + g.pv * s;
      const rIn = g.Rc - g.de / 2, rOut = g.Rc + g.de / 2;
      const sOut = Math.min(g.Rr - g.de * 1.1, g.Rc + g.de / 2 + (g.Ri - g.Wb - g.Rc) * 0.4);
      heat += arrow(pol(sOut, a, z + g.pv * 0.3), pol(rOut + g.de * 0.25, a, z + g.de * 0.05));
      heat += arrow(pol(g.Rimp + (rIn - g.Rimp) * 0.45, a, z + g.pv * 0.3), pol(rIn - g.de * 0.25, a, z + g.de * 0.05));
    }
    out.heat = `<g class="bx-heat">${heat}</g>`;

    // --- Carcasa frontal
    let shellFront = "";
    const zHi = g.Hh;
    if (mode === "closed") {
      shellFront += part("shell", wall(g.Ro, 0, zHi, AZ - 90, AZ + 90, { step: 3 }));
    } else if (mode === "glass") {
      shellFront += `<g class="bx-glass">${wall(g.Ro, 0, zHi, AZ - 90, AZ + 90, { step: 4 })}</g>`;
      shellFront += L(arcPath(g.Ro, 0, AZ - 90, AZ + 90, 1), { tone: "hi" });
      shellFront += L(pathOf([pp(g.Ro, AZ - 90, 0), pp(g.Ro, AZ - 90, zHi)]), { tone: "hi" }) + L(pathOf([pp(g.Ro, AZ + 90, 0), pp(g.Ro, AZ + 90, zHi)]), { tone: "hi" });
      shellFront = part("shell", shellFront);
    } else {
      const ca = AZ + cutHalf, cb = AZ - cutHalf;
      const flank = (a0, a1) => wall(g.Ro, 0, zHi, a0, a1, { step: 3 });
      let s = flank(ca, AZ + 90) + flank(AZ - 90, cb);
      const face = (a, shade) => {
        const quad = [pp(g.Ri, a, zHi), pp(g.Ro, a, zHi), pp(g.Ro, a, 0), pp(g.Ri, a, 0)];
        const d = pathOf(quad, true);
        return `<g class="iso-solid"><path class="iso-fill" d="${d}"/><path class="iso-shade" data-shade="${shade}" d="${d}"/><path class="iso-line iso-edge" data-tone="hi" d="${d}"/></g>`;
      };
      s += face(ca, 1) + face(cb, 2);
      s += L(pathOf([pp(g.Ro, AZ + 90, 0), pp(g.Ro, AZ + 90, zHi)]), { tone: "hi" }) + L(pathOf([pp(g.Ro, AZ - 90, 0), pp(g.Ro, AZ - 90, zHi)]), { tone: "hi" });
      s += L(arcPath(g.Ro, 0, AZ + cutHalf, AZ + 90, 1), { tone: "hi" }) + L(arcPath(g.Ro, 0, AZ - 90, AZ - cutHalf, 1), { tone: "hi" });
      for (const zz of [g.Hh * 0.34, g.Hh * 0.67]) s += L(arcPath(g.Ro, zz, AZ + cutHalf, AZ + 90, 1) + arcPath(g.Ro, zz, AZ - 90, AZ - cutHalf, 1), { tone: "lo" });
      shellFront += part("shell", s + hit(pathOf([pp(g.Ro, AZ + 76, 6), pp(g.Ro, AZ + 76, zHi - 6)]), 18) + hit(pathOf([pp(g.Ro, AZ - 76, 6), pp(g.Ro, AZ - 76, zHi - 6)]), 18));
    }
    // Boquillas del medio en los costados
    const nozzle = (id, a, z, dir) => {
      const rn = 0.04 * g.Di, len = 0.16 * g.Di;
      const axisPts = [pol(g.Ro - 0.5, a, z), pol(g.Ro + len, a, z)];
      const t = tube(axisPts, rn, {});
      const fl = disc3(pol(g.Ro + len, a, z), pol(1, a, 0), rn * 1.7, 0.018 * g.Di, { shade: 2 });
      const e = dir > 0 ? [pol(g.Ro + len + 0.17 * g.Di, a, z), pol(g.Ro + len + 0.02 * g.Di, a, z)] : [pol(g.Ro + len + 0.02 * g.Di, a, z), pol(g.Ro + len + 0.17 * g.Di, a, z)];
      const arrowSvg = `<path class="bx-med-line" data-flow d="${pathOf(e.map((q) => pt(...q)))}"/>`;
      return part(id, t + fl + arrowSvg + hit(pathOf(axisPts.map((q) => pt(...q))), 16));
    };
    if (mode !== "closed" || true) {
      shellFront += nozzle("inlet", AZ + 78, g.Hh * 0.8, 1) + nozzle("outlet", AZ - 78, g.Hh * 0.12 + 6, -1);
    }
    out.shell = shellFront;
    anchors.inlet = { p: [...pol(g.Ro + 0.2 * g.Di, AZ + 78, g.Hh * 0.8)], side: "R", text: "Entrada del medio" };
    anchors.outlet = { p: [...pol(g.Ro + 0.2 * g.Di, AZ - 78, g.Hh * 0.12 + 6)], side: "L", text: "Salida del medio" };
    anchors.shell = { p: pol(g.Ro, AZ + 74, g.Hh * 0.52), side: "R", text: "Cuerpo del tanque" };

    // --- Tapa y accesorios
    const zl = g.Hh;
    let top = S(cylinder(0, 0, g.Rl, zl - 0.03 * g.Di, 0.03 * g.Di, P, 64, 0.5), { tone: "mid" });
    top += S(cylinder(0, 0, g.Rl, zl, g.lidT, P, 64, 0.9), { tone: "hi" });
    const bolts = Array.from({ length: 16 }, (_, i) => pp(g.Rl - 0.014 * g.Di - 1.4, (i / 16) * 360, zl + g.lidT));
    top += L(ring(0, 0, g.Rl - 0.014 * g.Di - 1.4 - 2.4, zl + g.lidT, P, 56), { tone: "faint" }) + dotsSvg(bolts, { size: 0.9, tone: "mid" });
    const lidTop = zl + g.lidT;
    // motor y reductor
    const Di = g.Di;
    let motor = S(cylinder(0, 0, 0.075 * Di, lidTop, 0.06 * Di, P, 32, 0.4), { tone: "mid" });
    motor += S(cylinder(0, 0, 0.1 * Di, lidTop + 0.06 * Di, 0.07 * Di, P, 36, 0.6), { tone: "mid" });
    motor += L(ring(0, 0, 0.1 * Di - 1.6, lidTop + 0.13 * Di, P, 36), { tone: "faint" });
    motor += dotsSvg(Array.from({ length: 6 }, (_, i) => pp(0.1 * Di - 3, (i / 6) * 360, lidTop + 0.13 * Di)), { size: 0.7, tone: "mid" });
    const mz = lidTop + 0.13 * Di;
    motor += S(cylinder(0, 0, 0.115 * Di, mz, 0.2 * Di, P, 40, 0.6), { tone: "hi" });
    motor += L(knurl(0, 0, 0.115 * Di, mz + 0.02 * Di, mz + 0.18 * Di, 30, P), { tone: "lo" });

  // ---------- Parte dinámica: impulsores y partículas ----------
  function dynamic(b, tsec) {

    const kind = b.par.impulsor, nB = kind === "rushton" ? 6 : kind === "inclinadas" ? 4 : 3, disc = kind === "rushton", stepA = 360 / nB;
    const ang = tsec * 360 * Math.min(1.8, Math.max(0.1, b.par.rpm / 200));

      for (const bl of blades.filter((q) => q.d >= 0)) s += S(extrude(ringOf2(bl.a, disc ? Rd : r0, Rimp), zc - h / 2, h / 2 - 0.2, P), { tone: "mid", crease: "none" });

  // ---------- Etiquetas con líneas de referencia ----------
  function labels(b, fontPx, ids) {
    const fs = (fontPx * W) / (document.querySelector("#fig svg")?.getBoundingClientRect().width || W);
    const list = ids.map((id) => ({ id, ...b.anchors[id] })).filter((q) => q.p);
    for (const q of list) { q.s = pt(...q.p); q.side = q.s[0] < W / 2 ? "L" : "R"; }

  }

})();

        <li>Correlaciones del lado del agua de tubo recto (Gnielinski); no se aplica corrección por curvatura de la hélice y el número de Dean solo se informa.</li>
        <li>h exterior: Nu = 0,9·Re^0,62·Pr^0,33 con Re del impulsor, Doran Ec. 9.36 (±20 % sin aire; Doran advierte que no se desarrolló para fermentadores).</li>
        <li>Bombeo: potencia hidráulica estimada, no sustituye la curva de la bomba. Se omiten: cinética de Monod y OTR, balance transitorio completo, pérdidas al ambiente y evaporación.</li>
        <li>Fuentes locales: agua (${BD.agua.fuente}); materiales (${BD.materiales.fuente}); sustratos (${BD.sustratos.fuente}); impulsores (${BD.impulsores.fuente}); agitación con aire (${BD.agitacion.fuente}). Los valores marcados "verificar" debes confirmarlos en el libro.</li>
        <li>En el dibujo, el color del líquido solo identifica el sustrato.</li>
      </ul></details>`;
    $("#btnApply")?.addEventListener("click", () => window.BiorreactorApp.setParametros({ N: Math.min(400, Math.max(1, c.Nreal)) }));
  }

  // ---------- Pestañas, chips y controles ----------
  function setTab(t) {
    state.tab = t;
    $$(".tab").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false"));
    $$(".panel").forEach((p) => (p.hidden = p.dataset.tab !== t));
  }
  function emit() {
    const r = calcular(state.goodPar, state.tshow);
    const detail = { parametros: { ...state.goodPar }, valido: !state.invalid, resultados: r.ok ? { L_m: r.L, A_m2: r.A, Q_W: r.Q, U_Wm2K: r.U, A_requerida_m2: r.Areq, N_requeridas: r.Nreq, velocidad_ms: r.vel } : null };
    try { window.dispatchEvent(new CustomEvent("biorreactor:cambio", { detail })); } catch (e) {}
    try { if (window.AndroidBridge && typeof window.AndroidBridge.onCambio === "function") window.AndroidBridge.onCambio(JSON.stringify(detail)); } catch (e) {}
  }


  // ---------- Despeje integrado en cada parámetro ----------
  const META_POR_DEFECTO = { Vw: "Qmet", Di: "ho", De: "vel", e: "U", kpar: "U", Dc: "Nteo", p: "Nteo", rpm: "Pagit", Dimp: "Pagit", aire: "Pagit", OUR: "Q", Yxs: "Qmet", phi: "Qagit", Qotros: "Q", Pvol: "Qagit", Qman: "Q", rhob: "Rei", cpb: "caudal", kb: "ho", mub: "Rei", muwr: "ho", ncir: "vel", Qdisp: "caudal", eta: "Pbomba", SK: "dPtot", dz: "dPtot", Tobj: "Areq", Tin: "caudal", Tout: "caudal", Rfo: "U", Rfi: "U", Ht: "Q" };
  function abrirDespeje(k) {
    const box = $(`#dp-${k}`), btn = $(`.dsp[data-d="${k}"]`);
    if (!box.hidden) { box.hidden = true; btn.setAttribute("aria-expanded", "false"); return; }
    const m0 = META_POR_DEFECTO[k] || "Q";
    box.innerHTML = `<p class="hint">Escribe el resultado que debe cumplirse y se calcula ${CAMPOS[k].etiqueta.toLowerCase()} con los demás datos de esta pestaña.</p>
      <label>Resultado que debe cumplirse<select class="dmeta">${METAS.map((m) => `<option value="${m.id}"${m.id === m0 ? " selected" : ""}>${m.et} (${m.u})</option>`).join("")}</select></label>
      <div class="inp"><input class="dval" type="text" inputmode="decimal" autocomplete="off" placeholder="valor"><span class="u dunit"></span></div>
      <details><summary>Intervalo de búsqueda (opcional)</summary><div class="inp"><input class="dlo" type="text" inputmode="decimal" placeholder="${CAMPOS[k].min}"><input class="dhi" type="text" inputmode="decimal" placeholder="${CAMPOS[k].max}"></div></details>
      <button class="btn dgo" type="button" data-d="${k}">Despejar</button><div class="dout" role="status"></div>`;
    const unit = () => { box.querySelector(".dunit").textContent = METAS.find((m) => m.id === box.querySelector(".dmeta").value).u; };
    box.querySelector(".dmeta").addEventListener("change", unit); unit();
    box.hidden = false; btn.setAttribute("aria-expanded", "true");
    box.querySelector(".dval").focus();
  }
  function correrDespeje(k) {
    const box = $(`#dp-${k}`), out = box.querySelector(".dout");
    const num = (sel) => { const t = box.querySelector(sel).value.trim().replace(",", "."); return t === "" ? NaN : Number(t); };
    const r = resolverDespeje(state.par, k, box.querySelector(".dmeta").value, num(".dval"), num(".dlo"), num(".dhi"));
    if (!r.ok) { out.innerHTML = `<p class="status" data-s="inconsistente">${r.msg}</p>`; flash("bad", r.msg); return; }
    const f = (v) => String(parseFloat(Number(v).toPrecision(5)));
    out.innerHTML = `<p class="status" data-s="coherente">${r.campo.etiqueta} = <b>${f(r.x)} ${r.campo.unidad}</b> (comprobación: ${f(r.comprobado)} ${r.meta.u}).</p>
      ${r.redondeo ? `<p class="hint">Se redondeó hacia arriba a un número entero.</p>` : ""}
      ${r.soluciones > 1 ? `<p class="hint">Hay ${r.soluciones} soluciones en el intervalo; se muestra la menor. Otras cerca de: ${r.otras.map(f).join(", ")} ${r.campo.unidad}.</p>` : ""}
      <button class="btn duse" type="button" data-d="${k}" data-v="${Number(f(r.x))}">Usar este valor</button>`;
  }
  $("#form").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-d]"); if (!b) return;
    const k = b.dataset.d;
    if (b.classList.contains("dsp")) abrirDespeje(k);
    else if (b.classList.contains("dgo")) correrDespeje(k);
    else if (b.classList.contains("duse")) window.BiorreactorApp.setParametros({ [k]: Number(b.dataset.v) });
  });
  $("#form").addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.matches(".dval,.dlo,.dhi")) { ev.preventDefault(); correrDespeje(ev.target.closest(".dpanel").id.slice(3)); } });
  function flash(kind, msg) {
    const box = $("#toasts"), t = document.createElement("div");
    t.className = "toast"; t.dataset.k = kind; t.textContent = (kind === "bad" ? "Error: " : "Aviso: ") + msg;
    t.addEventListener("click", () => t.remove()); box.appendChild(t); setTimeout(() => t.remove(), 9000);
  }

  function init() {
    $("#chips").innerHTML = ORDEN_COMPONENTES.map((id) => `<button class="chip" type="button" data-id="${id}" aria-pressed="false">${COMPONENTES[id].nombre}</button>`).join("");
    $("#chips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) select(state.sel === b.dataset.id ? null : b.dataset.id); });
    $$(".tab").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
    $$("[data-view]").forEach((b) => b.addEventListener("click", () => { state.view = b.dataset.view; $$("[data-view]").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false")); rebuild(); }));
    $("#btnLabels").addEventListener("click", (e) => { state.labels = !state.labels; e.currentTarget.setAttribute("aria-pressed", String(state.labels)); rebuild(); });
    $("#btnPause").addEventListener("click", (e) => { state.paused = !state.paused; e.currentTarget.setAttribute("aria-pressed", String(state.paused)); e.currentTarget.textContent = state.paused ? "Reanudar" : "Pausar"; $("#svg").classList.toggle("paused", state.paused); kick(); });
    $("#btnTheme").addEventListener("click", () => { const light = document.body.dataset.theme !== "light"; document.body.dataset.theme = light ? "light" : "dark"; });
    $("#btnReset").addEventListener("click", () => { state.par = sincronizar({ ...VALORES_ILUSTRATIVOS, L: 0 }, "N"); state.anchor = "N"; state.tshow = state.par.T0; buildForm(); applyParams(); });
    $("#tshow").addEventListener("input", (e) => { state.tshow = Number(e.target.value); $("#tshowv").textContent = nf(state.tshow, 1) + " °C"; paintTemps(); renderCalc(); readout(); });
    $("#svg").addEventListener("click", (e) => { const part = e.target.closest("[data-part]"); const lab = e.target.closest("[data-label]"); const id = part?.dataset.part || lab?.dataset.label || null; select(id === state.sel ? null : id); });
    new ResizeObserver(() => { clearTimeout(init.rz); init.rz = setTimeout(() => { const small = ($("#svg").getBoundingClientRect().width || 600) < 520 && !state.labels; if (small !== state.compact) rebuild(); else drawLabels(); }, 80); }).observe($("#svg"));
    new IntersectionObserver((en) => { G.visible = en[en.length - 1].isIntersecting; if (G.visible) kick(); }, { rootMargin: "100px" }).observe($("#svg"));
    document.addEventListener("visibilitychange", kick);
    still.addEventListener?.("change", () => { if (still.matches) frame(performance.now()); kick(); });
    document.body.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    if (($("#svg").getBoundingClientRect().width || 600) < 520) { state.labels = false; $("#btnLabels").setAttribute("aria-pressed", "false"); }
    buildForm();
    syncT();
    setTab("comp");
    applyParams();
    renderInfo();
    kick();
    window.BiorreactorApp = {
      getParametros: () => ({ ...state.goodPar }),
      setParametros: (obj) => { state.par = sincronizar({ ...state.par, ...obj }, obj && "L" in obj && !("N" in obj) ? "L" : "N"); buildForm(); applyParams(); },
      seleccionar: select,
      resultados: () => calcular(state.goodPar, state.tshow),
    };
  }
  return { init, state };
})();
APP.init();
</script></body></html>
