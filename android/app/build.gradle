plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thermabio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thermabio.app'
        minSdk 23
        targetSdk 35
        versionCode 24
        versionName '1.6.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    androidResources {
        noCompress += ['ttf']
    }
}
